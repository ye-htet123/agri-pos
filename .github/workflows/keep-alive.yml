name: Keep Render Awake

# Pings the Render health endpoint every 5 minutes so the free-tier dyno
# never sleeps (Render idles a service after ~15 min without traffic).
#
# The production URL is baked in below. To override it without editing this
# file, set a repository variable RENDER_HEALTH_URL under
# Settings → Secrets and variables → Actions → Variables.

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes
  workflow_dispatch: {} # allows manual runs from the Actions tab

env:
  DEFAULT_HEALTH_URL: https://agri-pos-api.onrender.com/api/v1/health

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          TARGET="${HEALTH_URL:-$DEFAULT_HEALTH_URL}"
          echo "Pinging $TARGET"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$TARGET")
          echo "$(date -u +%FT%TZ) $TARGET -> HTTP $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "::warning::Health endpoint unreachable"
          fi
