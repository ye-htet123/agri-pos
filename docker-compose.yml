version: '3.8'

services:
  # 1. Express Node.js API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agri_pos_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/agri-pos
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=agri_pos_access_secret_key_prod_2026
      - JWT_REFRESH_SECRET=agri_pos_refresh_secret_key_prod_2026
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongodb
      - redis
    networks:
      - agri_network

  # 2. React Vite Frontend Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: agri_pos_client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - agri_network

  # 3. MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: agri_pos_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - agri_network

  # 4. Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: agri_pos_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agri_network

networks:
  agri_network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
